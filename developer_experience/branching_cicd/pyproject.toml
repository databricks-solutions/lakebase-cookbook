# Managed with uv (https://docs.astral.sh/uv/). Lint/format with ruff.
#   uv sync                 # install deps into .venv
#   uv run ruff check .     # lint
#   uv run ruff format .    # format
#
# These are the deps the CI/CD scripts import (see .github/scripts/requirements.txt,
# which the GitHub runners install). They are declared here too so the example
# lints and runs under uv locally.
[project]
name = "branching_cicd"
version = "0.1.0"
description = "Validate Lakebase schema changes on an isolated branch in GitHub CI/CD."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
