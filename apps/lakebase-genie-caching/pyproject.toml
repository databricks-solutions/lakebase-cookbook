[project]
name = "lakebase-genie-caching"
version = "0.1.0"
description = "Lakebase Genie Caching: semantic cache + user memory for Databricks Genie"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "databricks-sdk>=0.89.0",
    "databricks-ai-bridge>=0.14.0",
    "databricks-langchain[memory]>=0.19.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-core>=0.3.0",
    "mlflow>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "backend", "scripts"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "hatchling>=1.27.0",
]

[project.scripts]
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"


[tool.ruff]
line-length = 100
target-version = "py311"
# Generated/vendored assets, and the checked-in frontend build output.
extend-exclude = ["frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]
